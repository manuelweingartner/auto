name: ics

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

permissions:
  contents: read
  actions: write

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      # GitHub schaltet Cron-Workflows nach 60 Tagen ohne Commit still ab. Das Repo ändert sich
      # nach dem Bau kaum, darum hält sich der Workflow hier bei jedem Lauf selbst wach.
      - run: gh api -X PUT "repos/$GITHUB_REPOSITORY/actions/workflows/ics.yml/enable"
        env:
          GH_TOKEN: ${{ github.token }}
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/ics-export.js
        env:
          AUTO_HUNDE_GEHEIM: ${{ secrets.AUTO_HUNDE_GEHEIM }}
          GIST_TOKEN: ${{ secrets.GIST_TOKEN }}
          GIST_ID: ${{ secrets.GIST_ID }}
